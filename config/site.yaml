# ── Areas ────────────────────────────────────────────────────
# The main "shelves" of the site. Every project and article says which
# area(s) it belongs to with   areas: [llm-agents, ops]
# Each area gets its own page at /areas/<id> and its own colour.
#   id       short name used in your files (letters, numbers, dashes)
#   visual   which part of the home-page animation it lights up:
#            patches (images), wave (audio), graph (agents), rail (infrastructure)
areas:
  - id: llm-agents
    name: LLMs & Agents
    short: RAG, multi-agent systems, fine-tuning
    intro: >-
      Language models that do real work: retrieval-augmented generation over company
      documents, multi-agent systems that check each other's output, and LoRA/QLoRA
      fine-tuning for domain tasks.
    visual: graph
    color: { dark: "#B39CFF", light: "#6541D6" }
  - id: ops
    name: LLMOps & MLOps
    short: Serving, GPU infrastructure, monitoring
    intro: >-
      Everything between a trained model and a reliable product: TensorRT, Triton and
      vLLM on H100s, KVM with GPU passthrough, queues, streaming APIs, experiment
      tracking and observability.
    visual: rail
    color: { dark: "#4FD6BE", light: "#0A7F6B" }
  - id: speech-audio
    name: Speech & Audio
    short: ASR, TTS, wake word, audio LLMs
    intro: >-
      Systems that listen and speak: streaming ASR trained on tens of thousands of hours
      of Persian, bilingual TTS, on-device wake-word detection and audio language models.
    visual: wave
    color: { dark: "#FF9470", light: "#C2410C" }
  - id: applied-ml
    name: Applied ML
    short: Computer vision, medical imaging and more
    intro: >-
      Machine learning outside of language and speech, including deep learning for
      medical imaging.
    visual: patches
    color: { dark: "#6FB9FF", light: "#1F62C7" }

# Top menu. Add, remove or reorder freely.
