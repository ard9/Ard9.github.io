home:
  headline: I build ML systems, from raw audio to autonomous agents.
  intro: >-
    I'm a machine learning engineer working across LLM agents, speech and audio models,
    and the MLOps infrastructure that takes them to production. This site collects my
    projects, files and the things I write along the way.
  # Blocks on the home page, in this order: projects, writing, experience, contact, areas
  # (the areas already appear under the hero animation; "areas" adds a longer list)
  sections: [projects, writing, experience, contact]
  projects_count: 5
  writing_count: 4
  experience_title: Latest role
  contact_title: Working on something similar?
  contact_text: I'm happy to talk about ML engineering roles, collaborations and questions about anything on this site.

sections:
  projects:
    title: Work & files
    intro: Projects I've built, with the code, results and files that go with them.
  writing:
    title: Writing
    intro: Tutorials and notes on LLMs, MLOps and speech. Many come with a notebook you can run in Colab.
  areas:
    title: Areas
    intro: The fields I work in. Each one collects the related projects, writing and skills.
  cv:
    title: Curriculum vitae

footer:
  note: Built with Astro. All content lives in plain text files on GitHub.

# ── Fonts ────────────────────────────────────────────────────
#  Built in (no setup): Bricolage Grotesque, Instrument Sans, JetBrains Mono
#  Any other name is loaded from Google Fonts. Copy the exact name from fonts.google.com
#  Optional detail:
#      body:
#        family: Lora
#        weights: "400;600"      # or a range for variable fonts, e.g. "300..700"
#        italic: true
#  If a Google font has only one weight (e.g. Bebas Neue), set weights: "400"
fonts:
  display: Bricolage Grotesque   # headings, menu, buttons
  body: Instrument Sans          # paragraphs and articles
  code: JetBrains Mono           # code blocks

# ── Colours ──────────────────────────────────────────────────
# Visitors can switch between dark and light with the button in the header.
# default: dark, light, or system (follow the visitor's device)
theme:
  default: system
  dark:
    background: "#10131B"
    surface: "#171B26"
    line: "#272D3C"
    text: "#E8EBF2"
    muted: "#8C94A7"
  light:
    background: "#F4F5F8"
    surface: "#FFFFFF"
    line: "#DCE0E8"
    text: "#141823"
    muted: "#596173"
